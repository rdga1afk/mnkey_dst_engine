name: CI

on:
  push:
    branches: [master]
    paths:
      - 'include/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'include/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ci.yml'
  workflow_dispatch: {}

# ── Підхід 1: GitHub Releases artifact ───────────────────────────────────────
# engine CI (public, ∞ хв) будує libmonkey_dust_engine.a + усі deps
# і публікує як release asset, тегований по git SHA.
# monkey_dust CI (private) скачує готовий артефакт → компілює тільки game/tests.
#
# Підхід 2: Docker image на ghcr.io (окремий workflow: docker.yml)
# Підхід 3: Тести engine API переносяться сюди (70/76 тестів тільки engine API)

jobs:
  # ── Compile check + artifact publish ─────────────────────────────────────────
  build-and-publish:
    name: Engine/${{ matrix.config }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    permissions:
      contents: write  # для публікації release artifacts

    steps:
      - uses: actions/checkout@v4

      # third_party deps не входять до engine submodule — клонуємо потрібні.
      # Версії пінені до SHA щоб build був reproducible.
      - name: Checkout third_party deps
        run: |
          mkdir -p third_party
          git clone --depth=1 https://github.com/skypjack/entt \
            third_party/entt
          git clone --depth=1 https://github.com/g-truc/glm \
            third_party/glm
          git clone --depth=1 https://github.com/recastnavigation/recastnavigation \
            third_party/recastnavigation
          git clone --depth=1 https://github.com/google/googletest \
            third_party/googletest
          # JoltPhysics — велика бібліотека, клонуємо shallow
          git clone --depth=1 --branch v5.1.0 \
            https://github.com/jrouwe/JoltPhysics \
            third_party/JoltPhysics
          # ozz-animation
          git clone --depth=1 \
            https://github.com/guillaumeblanc/ozz-animation \
            third_party/ozz-animation

      # renderdoc_app.h: single header, MIT-licensed, from RenderDoc SDK.
      # Locally found via /usr/include (RenderDoc apt/pacman package) — the
      # CI runner has no such install, so fetch just this one header instead.
      # Pinned to a commit SHA (not the mutable v1.x branch) + checksummed,
      # same reproducibility bar as the JoltPhysics tag pin above.
      - name: Fetch renderdoc_app.h
        run: |
          mkdir -p third_party/renderdoc
          curl -sSfL -o third_party/renderdoc/renderdoc_app.h \
            https://raw.githubusercontent.com/baldurk/renderdoc/f8c90b0032c3e9c87a692ed640b91e53d9c139ee/renderdoc/api/app/renderdoc_app.h
          echo "b7005e7dc34c3635046868bbd76d81b9b055aede0f56daa0bd39fedee0639ffb  third_party/renderdoc/renderdoc_app.h" | sha256sum -c -

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            cmake ninja-build ccache \
            liblua5.4-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            libegl1-mesa-dev libdrm-dev libgbm-dev

      # SDL3: кешується по версії — build тільки при cache miss (1 раз).
      - name: Cache SDL3
        id: sdl3
        uses: actions/cache@v4
        with:
          path: /opt/sdl3
          key: sdl3-ubuntu24-3.4.8-static

      - name: Build SDL3
        if: steps.sdl3.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 --branch release-3.4.8 \
            https://github.com/libsdl-org/SDL SDL3_src
          cmake -S SDL3_src -B SDL3_build \
            -DSDL_STATIC=ON -DSDL_SHARED=OFF \
            -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF \
            -DSDL_X11_XSCRNSAVER=OFF -DSDL_X11_XTEST=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/sdl3
          cmake --build SDL3_build --parallel $(nproc)
          cmake --install SDL3_build

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-engine-${{ matrix.config }}-${{ github.sha }}
          restore-keys: ccache-engine-${{ matrix.config }}-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS=-I$(pwd)/third_party/renderdoc \
            -DMD_STATIC_DEPS=OFF \
            -DCMAKE_PREFIX_PATH=/opt/sdl3

      - name: Build
        run: ninja -C build monkey_dust_engine

      - name: ccache stats
        run: ccache -s

      # ── Підхід 1: Пакуємо артефакт і публікуємо ──────────────────────────────
      # Тільки для Release build — Debug занадто великий (~3x).
      - name: Package engine artifact
        if: matrix.config == 'Release'
        run: |
          mkdir -p dist/lib dist/include
          cp build/libmonkey_dust_engine.a dist/lib/
          cp -r include/monkey_dust dist/include/
          # SDL3 static lib для линкування в main repo
          cp /opt/sdl3/lib/libSDL3.a dist/lib/ 2>/dev/null || true
          # Версія + SHA для трекінгу
          echo "${{ github.sha }}" > dist/engine_sha.txt
          tar -czf engine-release-${{ github.sha }}.tar.gz -C dist .

      - name: Upload artifact (Підхід 1)
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: engine-release-${{ github.sha }}
          path: engine-release-${{ github.sha }}.tar.gz
          retention-days: 30

      # Публікуємо як GitHub Release при push у master (не PR)
      - name: Publish GitHub Release (Підхід 1)
        if: matrix.config == 'Release' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Видаляємо старий release з тим самим тегом якщо є
          gh release delete "engine-${{ github.sha }}" --yes 2>/dev/null || true
          gh release create "engine-${{ github.sha }}" \
            --title "Engine build ${{ github.sha }}" \
            --notes "Auto-built engine artifact. Use in monkey_dust CI to skip engine recompilation." \
            --prerelease \
            engine-release-${{ github.sha }}.tar.gz
