name: Docker Build Environment

on:
  push:
    branches: [master]
    paths:
      - 'CMakeLists.txt'
      - '.github/Dockerfile'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

# ── Підхід 2: Docker image на ghcr.io ────────────────────────────────────────
# engine CI (public) будує образ з усіма deps + libmonkey_dust_engine.a.
# monkey_dust CI (private) запускається в цьому образі → тільки компілює game/.
#
# Образ тегується: ghcr.io/rdga1afk/monkey_dust-buildenv:latest
# і ghcr.io/rdga1afk/monkey_dust-buildenv:<engine-sha>
#
# Переваги vs Підходу 1:
#   - Не потрібно завантажувати/розпаковувати tarball
#   - Усі системні залежності вже в образі
#   - main CI запускається в образі напряму (~30с setup vs ~3 хв deps install)

jobs:
  build-docker:
    name: Build & Push Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write  # для ghcr.io push

    steps:
      - uses: actions/checkout@v4

      - name: Checkout third_party deps
        run: |
          mkdir -p third_party
          git clone --depth=1 https://github.com/skypjack/entt third_party/entt
          git clone --depth=1 https://github.com/g-truc/glm third_party/glm
          git clone --depth=1 https://github.com/recastnavigation/recastnavigation third_party/recastnavigation
          git clone --depth=1 --branch v5.1.0 https://github.com/jrouwe/JoltPhysics third_party/JoltPhysics
          git clone --depth=1 https://github.com/guillaumeblanc/ozz-animation third_party/ozz-animation

      # Required for cache-to: type=gha — the default 'docker' builder
      # driver can't export cache at all ("Cache export is not supported
      # for the docker driver"), which failed every run of this workflow
      # since it was added (2026-06-03). docker-container driver from
      # setup-buildx-action supports it.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rdga1afk/monkey_dust-buildenv
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
