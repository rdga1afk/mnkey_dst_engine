name: Deploy docs to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'index.html'
      - 'monkey_dust_docs.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'google*.html'   # search-engine site-verification files (Search Console etc.)
      - 'ksdp/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            index.html
            monkey_dust_docs.html
            robots.txt
            sitemap.xml
            google*.html
            ksdp
          sparse-checkout-cone-mode: false

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: KSDP lint and site under /ksdp/
        run: |
          mkdir -p _site && cp -r index.html monkey_dust_docs.html robots.txt sitemap.xml google*.html _site/ 2>/dev/null || true
          if [ -d ksdp/functions ]; then
            pip install -q pyyaml
            python3 ksdp/_gen/lint.py ksdp
            python3 ksdp/_gen/build.py ksdp _site/ksdp
          fi

      - name: Upload artifact (docs only)
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
