  name: AtmosphereManager::getColorAt
  summary: 'CPU twin of the sky shader: returns the sky colour (RGB) for one direction, from the same options the shader constants come from (radii, height, Rayleigh / Mie multipliers, sun intensity, wavelengths, g, exposure, sample count). It takes the sun direction from the controller (a virtual call on the SkyX owner''s controller), normalises it, casts a ray from the camera point (0, inner + (outer-inner)*height, 0) through the atmosphere and splits it into N samples (the sample count). Per sample it takes the height above the surface, the density exp((inner-h)*scale/scaleDepth), an optical depth built with the usual polynomial exp(-0.00287 + x*(0.459 + x*(3.83 + x*(-6.8 + x*5.25)))) for the sun-side and view-side paths, and accumulates Rayleigh attenuation exp(-(Kr4PI + Km4PI) * depth / wavelength^4 terms) per channel (the three channels use 1/wavelength^4 with the wavelength powers 4.0). After the loop it applies the Rayleigh phase 0.75*(1+cos^2) and the Mie phase 1.5*((1-g^2)/(2+g^2))*(1+cos^2)/(1+g^2-2g*cos)^1.5,
    with cos the angle between the sun and the viewed direction. The owner''s lighting-mode field (+0x70: 0 = LDR, 1 = HDR, as the ground-program choice in the helper at 0x18000b590 shows) picks the output: in LDR the colour is tone-mapped, 1 - exp(-exposure * (sun-side + mie-side term)) per channel; in HDR it is the linear radiance times exposure. Both branches then add a faint night tint: the sun height (negated, clamped 0..1) gives 2 - 0.75*that, scaled by 0.05 (G) and 0.1 (B), weighted by (1 - y of the normalised vector)^3 and by 1 - 10*(largest channel) clamped to 0..1; in the HDR branch the tint is raised to the power 2.2 first. Constants (2.0, 0.75, 0.05, 0.1, 10.0, 3.0, 2.2, 1.5, 0.00287 / 0.459 / 3.83 / 6.8 / 5.25) read from the DLL''s data section.'
