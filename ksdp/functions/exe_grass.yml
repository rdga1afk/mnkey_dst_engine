  summary: 'Placement without a density map: for each of the requested plants it draws two uniform numbers from the loader''s random source and puts a candidate at (minx + (maxx-minx)*u, minz + (maxz-minz)*v) inside the page. A function pointer stored inside the loader object (+0x10) is called with the candidate (x, z) and the loader''s +0x38 field; the plant is kept when its result is not above the layer''s limit at +0x34. When the layer has min / max limits (+0x2c, +0x30; zero means no limit, taken as -inf / +inf) a second pointer (+0x30) is also called and checked against them. When the layer''s clip flag (+0x60) is set the candidate must lie inside the clipping rectangle (+0x40..+0x4c) to have its x, z written; a kept candidate outside the rectangle still gets its scale and angle written, so the output then holds two floats for it instead of four. A kept plant is written as x, z, a random scale in [0,1) and a random angle (in [0, 2 pi) in the plain variant, using the Ogre TWO_PI constant,
