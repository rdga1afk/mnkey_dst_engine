  name: grass_loader_load_page
  summary: 'Builds the grass for one page (a rectangle minx, minz, maxx, maxz in the first four floats of the page record). It walks every grass layer of the loader and takes those whose bounds overlap the page. For each it computes the plant count as the layer''s density (+0x18) times the loader''s global density factor (+0x4c) times the page area, truncated to an integer, and allocates 4 floats per plant. It then fills the positions with one of three generators chosen by the layer''s density-map mode: no map, mode 0 or mode 1 (the ''colour / density map'' object at +0x50, its mode at +0x2c). A layer''s mesh style (+0x3c = 0, 1 or 2) picks one of three mesh builders that turn the positions into one mesh; if a mesh came out it is made into an entity without shadows, attached at the page''s position and remembered in the page record.'
